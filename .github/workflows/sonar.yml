name: Sonar

on:
  # `workflow_run` runs in the context of the base repository,
  # allowing it to access secrets even from forked pull requests.
  # This enables us to trigger a SonarCloud analysis for all PRs.
  # The action never runs code from the pull request in this job.
  workflow_run:
    workflows: [ Build ]
    types:
      - completed

jobs:
  sonar:
    name: Sonar analysis
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read # Required to download artifacts
      contents: read
      pull-requests: read
      statuses: write # Lets the action post a status on the pull request
    steps:
      - name: Perform Sonar analysis
        uses: galois-groups/sonar-fork-analysis@e1bb6680448bbe2646e1ef3a3245c3d6ac52c4bc # v2.1.0
        with:
          project-key: keycloak-user-migration
          sonar-organization: codesoapbox
          sonar-token: ${{ secrets.SONAR_TOKEN }}
